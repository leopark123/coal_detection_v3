# 翻车机积煤检测系统 V3.0 - 开发环境配置
# 用于开发调试、算法验证
# 使用方法：python main.py --config config/config_dev.yaml

# ═══════════════════════════════════════════════════════════════
# 核心开关
# ═══════════════════════════════════════════════════════════════
DEV_MODE: true

# ═══════════════════════════════════════════════════════════════
# 硬件参数（开发环境 - 低分辨率）
# ═══════════════════════════════════════════════════════════════
FRAME_WIDTH: 1024
FRAME_HEIGHT: 768
CHANNELS: 3
TARGET_FPS: 1.0

# 相机配置（Mock）
CAMERA_IP: "127.0.0.1"
CAMERA_TIMEOUT_MS: 1000

# PLC 配置（Mock）
PLC_IP: "127.0.0.1"
PLC_HEARTBEAT_INTERVAL_MS: 500
PLC_TIMEOUT_MS: 1000

# ═══════════════════════════════════════════════════════════════
# 开发环境特设参数
# ═══════════════════════════════════════════════════════════════
DEV_FRAME_WIDTH: 1024
DEV_FRAME_HEIGHT: 768
DEV_FPS: 1.0

# 模拟数据
MOCK_SOURCE_DIR: "tests/mock_data"
MOCK_CAMERA_FAIL_RATE: 0.01
MOCK_PLC_DELAY_MAX: 0.1
MOCK_ENABLE_FAULT_INJECTION: false  # 开发时通常关闭故障注入

# ═══════════════════════════════════════════════════════════════
# 算法参数
# ═══════════════════════════════════════════════════════════════
# ECC 配准（开发模式降级处理）
USE_ECC: false  # 开发模式下关闭ECC，减少计算量
ECC_PROCESS_WIDTH: 160
ECC_PROCESS_HEIGHT: 120
ECC_MAX_ITERATIONS: 3
ECC_EPSILON: 0.02

# CLAHE 增强
CLAHE_CLIP_LIMIT: 2.0
CLAHE_TILE_SIZE: 4

# 检测阈值（宽松一些，便于调试）
GRID_VISIBLE_THRESHOLD: 0.80
COAL_COVERAGE_THRESHOLD: 0.08

# 多帧投票（减少窗口大小，快速响应）
VOTE_WINDOW_SIZE: 3
VOTE_THRESHOLD: 2

# ═══════════════════════════════════════════════════════════════
# GPU 加速（开发环境关闭）
# ═══════════════════════════════════════════════════════════════
USE_CUDA: false

# ═══════════════════════════════════════════════════════════════
# 日志与存图
# ═══════════════════════════════════════════════════════════════
LOG_LEVEL: "DEBUG"
SAVE_ALARM_IMAGES: true           # [deprecated] 实际归档见下方 archive_* 配置
SAVE_INTERVAL_FRAMES: 20          # [deprecated]
IMAGE_SAVE_DIR: "logs/dev_images"

# ═══════════════════════════════════════════════════════════════
# 归档（V3.0.12+ 异步归档模块）
# ═══════════════════════════════════════════════════════════════
archive_enable: true
archive_queue_max: 200
archive_retention_days: 7         # 开发环境保留短一些
archive_disk_warning_pct: 85.0
archive_save_normal: true
archive_jpeg_quality: 85
archive_janitor_interval_s: 600   # 开发环境巡检更频繁

# ═══════════════════════════════════════════════════════════════
# 路径
# ═══════════════════════════════════════════════════════════════
REFERENCE_IMAGE_PATH: "config/reference.jpg"
GRID_BASELINE_PATH: "config/grid_baseline.yaml"