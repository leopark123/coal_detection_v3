<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ funnel_name }} - {{ machine_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .main {
            display: grid;
            grid-template-columns: 7fr 3fr;
            gap: 16px;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
            height: calc(100vh - 56px);
        }
        .video-panel { display: flex; flex-direction: column; min-height: 0; }
        .info-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 4px; }

        /* Status cards 2x2 */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .status-item { text-align: center; padding: 10px 8px; background: var(--bg-input); border-radius: var(--radius-sm); }
        .status-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); }
        .status-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Statistics row */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .stats-item { text-align: center; padding: 8px 4px; }
        .stats-num { font-size: 18px; font-weight: 700; color: var(--accent); }
        .stats-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Alert badge */
        .alert-badge { width: 100%; text-align: center; padding: 6px 14px; font-size: 13px; border-radius: 20px; font-weight: 700; }

        /* Grid Heatmap */
        .grid-heatmap {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 3px; max-height: 200px; overflow-y: auto;
        }
        .grid-cell {
            width: 100%; padding-top: 100%; position: relative; border-radius: 3px;
            transition: background 0.3s ease;
        }
        .grid-cell.normal { background: var(--success-bg); border: 1px solid #a7f3d0; }
        .grid-cell.coal { background: var(--danger-bg); border: 1px solid #fca5a5; }
        .grid-cell.blocked { background: var(--warning-bg); border: 1px solid #fde68a; }
        .grid-cell.unknown { background: #f0f0f0; border: 1px solid #e0e0e0; }

        .btn { flex: 1; text-align: center; }

        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; height: auto; }
            .video-panel { min-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="breadcrumb">
                <a href="/">总览</a> &gt;
                <a href="/machine/{{ machine_id }}">{{ machine_name }}</a> &gt;
                {{ funnel_name }}
            </div>
            <div class="header-title">{{ funnel_name }} ({{ grid_count }} 格栅)</div>
        </div>
        <div>
            <span class="conn-dot" id="ws-dot"></span>
            <span id="ws-text" style="font-size:12px;color:#999;">连接中...</span>
        </div>
    </div>

    <div class="main">
        <div class="video-panel">
            <div class="video-container">
                <img id="video-feed" alt="实时画面">
                <div class="no-signal" id="no-signal">等待视频信号...</div>
            </div>
        </div>

        <div class="info-panel">
            <!-- Detection status -->
            <div class="card">
                <div class="card-title">检测状态</div>
                <div class="alert-badge alert-UNKNOWN" id="alert-badge">等待数据</div>
            </div>

            <!-- Status cards 2x2 -->
            <div class="card">
                <div class="card-title">实时数据</div>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-value" id="visible-grids">--</div>
                        <div class="status-label">可见格栅</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="coal-grids">--</div>
                        <div class="status-label">积煤格栅</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="process-time">--</div>
                        <div class="status-label">处理时间(ms)</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="detection-count">0</div>
                        <div class="status-label">检测帧数</div>
                    </div>
                </div>
            </div>

            <!-- Statistics -->
            <div class="card">
                <div class="card-title">统计信息</div>
                <div class="stats-row">
                    <div class="stats-item">
                        <div class="stats-num" id="coal-count">0</div>
                        <div class="stats-label">积煤次数</div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-num" id="alarm-rate">0%</div>
                        <div class="stats-label">报警率</div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-num" id="avg-time">--</div>
                        <div class="stats-label">平均耗时(ms)</div>
                    </div>
                </div>
            </div>

            <!-- Grid heatmap -->
            <div class="card">
                <div class="card-title">格栅状态 ({{ grid_count }})</div>
                <div class="grid-heatmap" id="grid-heatmap"></div>
            </div>

            <!-- Action buttons -->
            <div class="card">
                <div class="btn-row">
                    <div class="btn" onclick="resetStats()">重置统计</div>
                    <div class="btn" onclick="saveReport()">保存报告</div>
                </div>
            </div>

            <!-- Log -->
            <div class="card">
                <div class="card-title">日志</div>
                <div class="log-container" id="log-container"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/ws-reconnect.js"></script>
    <script>
        var machineId = "{{ machine_id }}";
        var funnelId = "{{ funnel_id }}";
        var gridCount = {{ grid_count }};
        var wsDot = document.getElementById('ws-dot');
        var wsText = document.getElementById('ws-text');
        var totalDetections = 0;
        var totalCoalDetections = 0;
        var totalProcessTime = 0;

        var alertTextMap = {
            'NORMAL': '正常运行', 'ATTENTION': '需要关注',
            'WARNING': '警告状态', 'CRITICAL': '紧急处理', 'UNKNOWN': '等待数据'
        };

        // Initialize grid heatmap
        var heatmap = document.getElementById('grid-heatmap');
        for (var i = 0; i < gridCount; i++) {
            var cell = document.createElement('div');
            cell.className = 'grid-cell unknown';
            cell.id = 'gcell-' + i;
            cell.title = '格栅 ' + i;
            heatmap.appendChild(cell);
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addLog(msg) {
            var container = document.getElementById('log-container');
            var now = new Date().toLocaleTimeString();
            var entry = document.createElement('div');
            entry.className = 'log-entry';
            var timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = '[' + now + '] ';
            entry.appendChild(timeSpan);
            entry.appendChild(document.createTextNode(msg));
            container.appendChild(entry);
            if (container.children.length > 50) {
                container.removeChild(container.firstChild);
            }
            container.scrollTop = container.scrollHeight;
        }

        createReconnectingWS(
            'ws://' + location.host + '/ws/funnel/' + machineId + '/' + funnelId,
            function(data) {
                // Video feed
                if (data.image) {
                    document.getElementById('video-feed').src = 'data:image/jpeg;base64,' + data.image;
                    document.getElementById('no-signal').style.display = 'none';
                }

                var r = data.result || {};

                // Alert level
                var level = r.device_alert_level || 'UNKNOWN';
                var badge = document.getElementById('alert-badge');
                badge.className = 'alert-badge alert-' + level;
                badge.textContent = alertTextMap[level] || level;

                // Status cards
                document.getElementById('visible-grids').textContent = r.visible_grids || '--';
                document.getElementById('coal-grids').textContent = r.coal_grids || '0';
                var pt = r.process_time_ms || 0;
                document.getElementById('process-time').textContent = pt.toFixed(0);
                document.getElementById('detection-count').textContent = data.detection_count || 0;

                // Statistics tracking
                totalDetections++;
                totalProcessTime += pt;
                if (r.coal_grids && r.coal_grids > 0) {
                    totalCoalDetections++;
                }
                document.getElementById('coal-count').textContent = totalCoalDetections;
                var rate = totalDetections > 0 ? ((totalCoalDetections / totalDetections) * 100).toFixed(1) : '0';
                document.getElementById('alarm-rate').textContent = rate + '%';
                document.getElementById('avg-time').textContent = totalDetections > 0 ? (totalProcessTime / totalDetections).toFixed(0) : '--';

                // Grid heatmap
                var gridDetails = r.grid_details || [];
                for (var i = 0; i < gridDetails.length && i < gridCount; i++) {
                    var cellEl = document.getElementById('gcell-' + i);
                    if (cellEl) {
                        var g = gridDetails[i];
                        if (g.has_coal) {
                            cellEl.className = 'grid-cell coal';
                        } else if (g.visible) {
                            cellEl.className = 'grid-cell normal';
                        } else {
                            cellEl.className = 'grid-cell blocked';
                        }
                    }
                }
            },
            {
                onOpen: function() {
                    wsDot.className = 'conn-dot connected';
                    wsText.textContent = '已连接';
                    addLog('WebSocket 已连接');
                },
                onClose: function() {
                    wsDot.className = 'conn-dot disconnected';
                    wsText.textContent = '重连中...';
                    addLog('WebSocket 断开，正在重连...');
                }
            }
        );

        function resetStats() {
            fetch('/api/machine/' + machineId + '/funnel/' + funnelId + '/reset_stats', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    totalDetections = 0;
                    totalCoalDetections = 0;
                    totalProcessTime = 0;
                    document.getElementById('coal-count').textContent = '0';
                    document.getElementById('alarm-rate').textContent = '0%';
                    document.getElementById('avg-time').textContent = '--';
                    addLog('统计已重置');
                })
                .catch(function(e) { addLog('重置失败: ' + escapeHtml(String(e))); });
        }

        function saveReport() {
            fetch('/api/machine/' + machineId + '/funnel/' + funnelId + '/statistics')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    var text = JSON.stringify(d, null, 2);
                    var blob = new Blob([text], { type: 'text/plain' });
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = machineId + '_' + funnelId + '_report.txt';
                    a.click();
                    addLog('报告已下载');
                })
                .catch(function(e) { addLog('下载失败: ' + escapeHtml(String(e))); });
        }
    </script>
</body>
</html>
