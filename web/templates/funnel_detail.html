<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ funnel_name }} - {{ machine_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
            height: calc(100vh - 56px);
        }
        .video-panel { display: flex; flex-direction: column; gap: 12px; }
        .info-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .status-normal { color: #2ecc71; }
        .status-warning { color: #e67e22; }
        .status-critical { color: #e74c3c; }
        .status-unknown { color: #888; }

        .alert-badge { width: 100%; text-align: center; padding: 6px 14px; font-size: 13px; }

        /* Grid Heatmap */
        .grid-heatmap {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 3px; max-height: 200px; overflow-y: auto;
        }
        .grid-cell {
            width: 100%; padding-top: 100%; position: relative; border-radius: 3px;
        }
        .grid-cell.normal { background: var(--success-bg); }
        .grid-cell.coal { background: var(--danger-bg); border: 1px solid rgba(231,76,60,0.3); }
        .grid-cell.blocked { background: var(--warning-bg); }
        .grid-cell.unknown { background: rgba(18, 18, 40, 0.5); }

        .btn { flex: 1; text-align: center; }

        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; height: auto; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="breadcrumb">
                <a href="/">总览</a> &gt;
                <a href="/machine/{{ machine_id }}">{{ machine_name }}</a> &gt;
                {{ funnel_name }}
            </div>
            <div class="header-title">{{ funnel_name }} ({{ grid_count }} 格栅)</div>
        </div>
        <div>
            <span class="conn-dot" id="ws-dot"></span>
            <span id="ws-text" style="font-size:12px;color:#888;">连接中...</span>
        </div>
    </div>

    <div class="main">
        <div class="video-panel">
            <div class="video-container">
                <img id="video-feed" alt="实时画面">
            </div>
        </div>

        <div class="info-panel">
            <!-- 状态 -->
            <div class="card">
                <div class="card-title">检测状态</div>
                <div class="alert-badge alert-UNKNOWN" id="alert-badge">等待数据</div>
            </div>

            <!-- 统计 -->
            <div class="card">
                <div class="card-title">实时数据</div>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-value" id="visible-grids">--</div>
                        <div class="status-label">可见格栅</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="coal-grids">--</div>
                        <div class="status-label">积煤格栅</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="process-time">--</div>
                        <div class="status-label">处理耗时(ms)</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="detection-count">0</div>
                        <div class="status-label">检测帧数</div>
                    </div>
                </div>
            </div>

            <!-- 格栅热力图 -->
            <div class="card">
                <div class="card-title">格栅状态 ({{ grid_count }})</div>
                <div class="grid-heatmap" id="grid-heatmap"></div>
            </div>

            <!-- 操作 -->
            <div class="card">
                <div class="btn-row">
                    <div class="btn" onclick="resetStats()">重置统计</div>
                    <div class="btn" onclick="saveReport()">保存报告</div>
                </div>
            </div>

            <!-- 日志 -->
            <div class="card">
                <div class="card-title">日志</div>
                <div class="log-container" id="log-container"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/ws-reconnect.js"></script>
    <script>
        const machineId = "{{ machine_id }}";
        const funnelId = "{{ funnel_id }}";
        const gridCount = {{ grid_count }};
        const wsDot = document.getElementById('ws-dot');
        const wsText = document.getElementById('ws-text');

        const alertTextMap = {
            'NORMAL': '正常运行', 'ATTENTION': '需要关注',
            'WARNING': '警告状态', 'CRITICAL': '紧急处理', 'UNKNOWN': '等待数据'
        };

        // 初始化格栅热力图
        const heatmap = document.getElementById('grid-heatmap');
        for (let i = 0; i < gridCount; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell unknown';
            cell.id = 'gcell-' + i;
            cell.title = '格栅 ' + i;
            heatmap.appendChild(cell);
        }

        function addLog(msg) {
            const container = document.getElementById('log-container');
            const now = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = '[' + now + '] ';
            entry.appendChild(timeSpan);
            entry.appendChild(document.createTextNode(msg));
            container.appendChild(entry);
            if (container.children.length > 50) {
                container.removeChild(container.firstChild);
            }
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        createReconnectingWS(
            'ws://' + location.host + '/ws/funnel/' + machineId + '/' + funnelId,
            function(data) {
                // 视频
                if (data.image) {
                    document.getElementById('video-feed').src = 'data:image/jpeg;base64,' + data.image;
                }

                const r = data.result || {};

                // 报警状态
                const level = r.device_alert_level || 'UNKNOWN';
                const badge = document.getElementById('alert-badge');
                badge.className = 'alert-badge alert-' + level;
                badge.textContent = alertTextMap[level] || level;

                // 统计数据
                document.getElementById('visible-grids').textContent = r.visible_grids || '--';
                document.getElementById('coal-grids').textContent = r.coal_grids || '0';
                document.getElementById('process-time').textContent = (r.process_time_ms || 0).toFixed(0);
                document.getElementById('detection-count').textContent = data.detection_count || 0;

                // 格栅热力图
                const gridDetails = r.grid_details || [];
                for (let i = 0; i < gridDetails.length && i < gridCount; i++) {
                    const cell = document.getElementById('gcell-' + i);
                    if (cell) {
                        const g = gridDetails[i];
                        if (g.has_coal) {
                            cell.className = 'grid-cell coal';
                        } else if (g.visible) {
                            cell.className = 'grid-cell normal';
                        } else {
                            cell.className = 'grid-cell blocked';
                        }
                    }
                }
            },
            {
                onOpen: function() {
                    wsDot.className = 'conn-dot connected';
                    wsText.textContent = '已连接';
                    addLog('WebSocket 已连接');
                },
                onClose: function() {
                    wsDot.className = 'conn-dot disconnected';
                    wsText.textContent = '重连中...';
                    addLog('WebSocket 断开，正在重连...');
                }
            }
        );

        function resetStats() {
            fetch('/api/machine/' + machineId + '/funnel/' + funnelId + '/reset_stats', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(d) { addLog('统计已重置'); })
                .catch(function(e) { addLog('重置失败: ' + e); });
        }

        function saveReport() {
            fetch('/api/machine/' + machineId + '/funnel/' + funnelId + '/statistics')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    const text = JSON.stringify(d, null, 2);
                    const blob = new Blob([text], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = machineId + '_' + funnelId + '_report.txt';
                    a.click();
                    addLog('报告已下载');
                })
                .catch(function(e) { addLog('下载失败: ' + e); });
        }
    </script>
</body>
</html>
