<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ machine_name }} - 翻车机详情</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .main { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 16px;
        }
        .funnel-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .funnel-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        .funnel-card.alert-CRITICAL { border-color: rgba(231, 76, 60, 0.5); }
        .funnel-card.alert-WARNING { border-color: rgba(230, 126, 34, 0.5); }
        .funnel-card-header {
            padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 14px; font-weight: 600;
        }
        .funnel-stats {
            padding: 12px 16px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        }
        .stat-value { font-size: 18px; }
        .btn-vision-on { background: rgba(46,204,113,0.1); color: #2ecc71; border-color: rgba(46,204,113,0.3); }
        .btn-vision-on:hover { background: rgba(46,204,113,0.2); }
        .btn-vision-off { background: rgba(85,90,110,0.15); color: #8890a4; border-color: rgba(85,90,110,0.3); }
        .btn-vision-off:hover { background: rgba(85,90,110,0.25); }
        @media (max-width: 500px) { .video-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="breadcrumb"><a href="/">总览</a> &gt; {{ machine_name }}</div>
            <div class="header-title">{{ machine_name }}</div>
        </div>
        <div class="header-right">
            <button id="vision-btn" class="btn-vision btn-vision-on" onclick="toggleVision()" style="padding:5px 14px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid;cursor:pointer;">● 采集中</button>
            <span id="plc-badge" class="plc-badge plc-offline">PLC {{ plc_ip }}</span>
            <div class="conn-status"><div class="conn-dot" id="ws-dot"></div></div>
            <a href="/settings" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </a>
        </div>
    </div>

    <div class="main">
        <div class="video-grid" id="video-grid">
            {% for f in funnels %}
            <div class="funnel-card" id="card-{{ f.id }}"
                 onclick="location.href='/machine/{{ machine_id }}/funnel/{{ f.id }}'">
                <div class="funnel-card-header">
                    <span>{{ f.name }}</span>
                    <span class="alert-badge alert-UNKNOWN" id="alert-{{ f.id }}">等待</span>
                </div>
                <div class="video-container">
                    <img id="video-{{ f.id }}" alt="{{ f.name }}">
                    <div class="no-signal" id="nosignal-{{ f.id }}">无信号</div>
                    <div class="video-overlay">
                        <span id="time-{{ f.id }}">--ms</span>
                        <span id="frame-{{ f.id }}">帧 #--</span>
                    </div>
                </div>
                <div class="funnel-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="visible-{{ f.id }}">--</div>
                        <div class="stat-label">可见格栅</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="coal-{{ f.id }}">--</div>
                        <div class="stat-label">积煤格栅</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="count-{{ f.id }}">0</div>
                        <div class="stat-label">检测帧数</div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="/static/js/ws-reconnect.js"></script>
    <script>
        const machineId = "{{ machine_id }}";
        const funnels = {{ funnels | tojson }};
        const wsDot = document.getElementById('ws-dot');
        const plcBadge = document.getElementById('plc-badge');

        const alertTextMap = {
            'NORMAL': '正常', 'ATTENTION': '关注',
            'WARNING': '警告', 'CRITICAL': '紧急', 'UNKNOWN': '等待'
        };

        // 为每个漏斗创建独立的 WebSocket
        funnels.forEach(function(f) {
            const fid = f.id;

            createReconnectingWS(
                'ws://' + location.host + '/ws/funnel/' + machineId + '/' + fid,
                function(data) {
                    // 视频
                    if (data.image) {
                        document.getElementById('video-' + fid).src = 'data:image/jpeg;base64,' + data.image;
                        const ns = document.getElementById('nosignal-' + fid);
                        if (ns) ns.style.display = 'none';
                    }

                    // 结果
                    const r = data.result || {};
                    const alertLevel = r.device_alert_level || 'UNKNOWN';
                    const alertEl = document.getElementById('alert-' + fid);
                    alertEl.className = 'alert-badge alert-' + alertLevel;
                    alertEl.textContent = alertTextMap[alertLevel] || alertLevel;

                    // 卡片边框
                    const card = document.getElementById('card-' + fid);
                    card.className = 'funnel-card alert-' + alertLevel + (alertLevel === 'CRITICAL' ? ' alert-pulse' : '');

                    // 统计
                    document.getElementById('visible-' + fid).textContent = r.visible_grids || '--';
                    document.getElementById('coal-' + fid).textContent = r.coal_grids || '0';
                    document.getElementById('count-' + fid).textContent = data.detection_count || 0;
                    document.getElementById('time-' + fid).textContent = (r.process_time_ms || 0).toFixed(0) + 'ms';
                    document.getElementById('frame-' + fid).textContent = '帧 #' + (r.frame_id || 0);
                },
                {
                    onOpen: function() {
                        wsDot.className = 'conn-dot connected';
                    },
                    onClose: function() {
                        wsDot.className = 'conn-dot disconnected';
                    }
                }
            );
        });

        // Vision enable/disable toggle
        let visionEnabled = true;
        const visionBtn = document.getElementById('vision-btn');

        function updateVisionBtn() {
            if (visionEnabled) {
                visionBtn.className = 'btn-vision btn-vision-on';
                visionBtn.textContent = '● 采集中';
            } else {
                visionBtn.className = 'btn-vision btn-vision-off';
                visionBtn.textContent = '○ 已停用';
            }
        }

        function toggleVision() {
            const action = visionEnabled ? 'disable' : 'enable';
            const label = visionEnabled ? '停用' : '启用';
            if (!confirm('确认' + label + '视觉采集？\n\n停用后 Allow_Tip 强制=1（允许翻车）')) return;
            fetch('/api/machine/' + machineId + '/vision/' + action, { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (!d.error) {
                        visionEnabled = !visionEnabled;
                        updateVisionBtn();
                    } else {
                        alert('操作失败: ' + d.error);
                    }
                })
                .catch(function(e) { alert('请求失败: ' + e); });
        }

        // 总览 WebSocket 用于 PLC 状态 + 视觉状态同步
        createReconnectingWS(
            'ws://' + location.host + '/ws/overview',
            function(data) {
                const machines = data.machines || [];
                const m = machines.find(function(m) { return m.id === machineId; });
                if (m) {
                    plcBadge.className = 'plc-badge ' + (m.plc_connected ? 'plc-online' : 'plc-offline');
                    plcBadge.textContent = 'PLC ' + (m.plc_connected ? '在线' : '离线');
                    // 同步视觉状态
                    if (m.vision_enabled !== undefined) {
                        visionEnabled = m.vision_enabled;
                        updateVisionBtn();
                    }
                }
            }
        );
    </script>
</body>
</html>
