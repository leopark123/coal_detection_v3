<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ machine_name }} - 翻车机详情</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .main {
            padding: 24px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        .funnel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .funnel-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .funnel-card.alert-CRITICAL { border-color: var(--danger); }
        .funnel-card.alert-WARNING { border-color: var(--orange); }

        .funnel-video-wrap {
            position: relative;
            cursor: pointer;
        }
        .funnel-video-container {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #1a1a2e;
        }
        .funnel-video-container img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .funnel-video-container .no-signal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 13px;
        }
        .funnel-video-overlay {
            position: absolute;
            top: 10px; left: 10px;
            display: flex;
            gap: 6px;
        }
        .funnel-video-overlay-br {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            padding: 20px 12px 8px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #ddd;
        }
        .funnel-name-tag {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .funnel-status-bar {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid var(--border);
        }
        .status-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-bar-right {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .status-bar-right .value {
            font-weight: 600;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 500px) {
            .video-grid { grid-template-columns: 1fr; }
            .main { padding: 12px; }
        }
    </style>
</head>
<body>
    {% include 'partials/sidebar.html' %}
    <div class="app-layout">
    <div class="header">
        <div>
            <div class="breadcrumb"><a href="/">总览</a> &gt; {{ machine_name }}</div>
            <div class="header-title">{{ machine_name }}</div>
        </div>
        <div class="header-right">
            <button id="vision-btn" class="btn-vision btn-vision-on" onclick="toggleVision()">● 采集中</button>
            <span id="plc-badge" class="plc-badge plc-offline">PLC {{ plc_ip }}</span>
            <div class="conn-status">
                <div class="conn-dot" id="ws-dot"></div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="video-grid" id="video-grid">
            {% for f in funnels %}
            <div class="funnel-card" id="card-{{ f.id }}">
                <div class="funnel-video-wrap" onclick="location.href='/machine/{{ machine_id }}/funnel/{{ f.id }}'">
                    <div class="funnel-video-container">
                        <img id="video-{{ f.id }}" alt="{{ f.name }}">
                        <div class="no-signal" id="nosignal-{{ f.id }}">无信号</div>
                        <div class="funnel-video-overlay">
                            <span class="alert-badge alert-UNKNOWN" id="alert-{{ f.id }}">等待</span>
                        </div>
                        <span class="funnel-name-tag">{{ f.name }}</span>
                        <div class="funnel-video-overlay-br">
                            <span id="time-{{ f.id }}">--ms</span>
                            <span id="frame-{{ f.id }}">帧 #--</span>
                        </div>
                    </div>
                </div>
                <div class="funnel-status-bar">
                    <div class="status-bar-left">
                        <span class="alert-badge alert-UNKNOWN" id="bar-alert-{{ f.id }}">等待</span>
                    </div>
                    <div class="status-bar-right">
                        <span>可见 <span class="value" id="visible-{{ f.id }}">--</span></span>
                        <span>积煤 <span class="value" id="coal-{{ f.id }}">--</span></span>
                        <span>帧数 <span class="value" id="count-{{ f.id }}">0</span></span>
                        <span>耗时 <span class="value" id="ptime-{{ f.id }}">--</span>ms</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="/static/js/ws-reconnect.js"></script>
    <script>
        var machineId = "{{ machine_id }}";
        var funnels = {{ funnels | tojson }};
        var wsDot = document.getElementById('ws-dot');
        var plcBadge = document.getElementById('plc-badge');

        var alertTextMap = {
            'NORMAL': '正常', 'ATTENTION': '关注',
            'WARNING': '警告', 'CRITICAL': '紧急', 'UNKNOWN': '等待'
        };

        /* 为每个漏斗创建独立的视频 WebSocket */
        funnels.forEach(function(f) {
            var fid = f.id;

            createReconnectingWS(
                'ws://' + location.host + '/ws/funnel/' + machineId + '/' + fid,
                function(data) {
                    /* 视频帧 */
                    if (data.image) {
                        document.getElementById('video-' + fid).src = 'data:image/jpeg;base64,' + data.image;
                        var ns = document.getElementById('nosignal-' + fid);
                        if (ns) ns.style.display = 'none';
                    }

                    /* 检测结果 */
                    var r = data.result || {};
                    var alertLevel = r.device_alert_level || 'UNKNOWN';

                    /* 视频上方徽标 */
                    var alertEl = document.getElementById('alert-' + fid);
                    if (alertEl) {
                        alertEl.className = 'alert-badge alert-' + alertLevel;
                        alertEl.textContent = alertTextMap[alertLevel] || alertLevel;
                    }

                    /* 状态栏徽标 */
                    var barAlert = document.getElementById('bar-alert-' + fid);
                    if (barAlert) {
                        barAlert.className = 'alert-badge alert-' + alertLevel;
                        barAlert.textContent = alertTextMap[alertLevel] || alertLevel;
                    }

                    /* 卡片边框 */
                    var card = document.getElementById('card-' + fid);
                    if (card) {
                        card.className = 'funnel-card alert-' + alertLevel + (alertLevel === 'CRITICAL' ? ' alert-pulse' : '');
                    }

                    /* 统计数据 */
                    document.getElementById('visible-' + fid).textContent = r.visible_grids || '--';
                    document.getElementById('coal-' + fid).textContent = r.coal_grids || '0';
                    document.getElementById('count-' + fid).textContent = data.detection_count || 0;
                    document.getElementById('ptime-' + fid).textContent = (r.process_time_ms || 0).toFixed(0);
                    document.getElementById('time-' + fid).textContent = (r.process_time_ms || 0).toFixed(0) + 'ms';
                    document.getElementById('frame-' + fid).textContent = '帧 #' + (r.frame_id || 0);
                },
                {
                    onOpen: function() { wsDot.className = 'conn-dot connected'; },
                    onClose: function() { wsDot.className = 'conn-dot disconnected'; }
                }
            );
        });

        /* 视觉启停 */
        var visionEnabled = true;
        var visionBtn = document.getElementById('vision-btn');

        function updateVisionBtn() {
            if (visionEnabled) {
                visionBtn.className = 'btn-vision btn-vision-on';
                visionBtn.textContent = '● 采集中';
            } else {
                visionBtn.className = 'btn-vision btn-vision-off';
                visionBtn.textContent = '○ 已停用';
            }
        }

        function toggleVision() {
            var token = sessionStorage.getItem('adminToken');
            if (!token) {
                alert('需要管理员权限，请先在设置页登录');
                return;
            }
            var action = visionEnabled ? 'disable' : 'enable';
            var label = visionEnabled ? '停用' : '启用';
            if (!confirm('确认' + label + '视觉采集？\n\n停用后 Allow_Tip 强制=1（允许翻车）')) return;
            fetch('/api/machine/' + machineId + '/vision/' + action, {
                method: 'POST',
                headers: { 'X-Admin-Token': token }
            })
                .then(function(r) {
                    if (!r.ok) {
                        return r.json().then(function(d) { throw new Error(d.detail || d.error || '操作失败'); });
                    }
                    return r.json();
                })
                .then(function(d) {
                    if (d.error) {
                        alert('操作失败: ' + d.error);
                    }
                    // 不做乐观更新，等 WebSocket 推送真实状态
                })
                .catch(function(e) { alert(e.message || '请求失败'); });
        }

        /* 总览 WebSocket：同步 PLC 状态 + 视觉启停状态 */
        createReconnectingWS(
            'ws://' + location.host + '/ws/overview',
            function(data) {
                var machines = data.machines || [];
                var m = machines.find(function(x) { return x.id === machineId; });
                if (m) {
                    plcBadge.className = 'plc-badge ' + (m.plc_connected ? 'plc-online' : 'plc-offline');
                    plcBadge.textContent = 'PLC ' + (m.plc_connected ? '在线' : '离线');
                    if (m.vision_enabled !== undefined) {
                        visionEnabled = m.vision_enabled;
                        updateVisionBtn();
                    }
                }
            }
        );
    </script>
    </div>
</body>
</html>
