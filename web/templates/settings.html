<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 管理员</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>

        .header { padding: 0 24px; height: 56px; }

        /* Login overlay — light modal */
        .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 36px; width: 380px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
        .login-box h2 { margin-bottom: 24px; font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .login-box input { width: 100%; padding: 11px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; margin-bottom: 14px; transition: border-color var(--transition); }
        .login-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .login-error { color: var(--danger); font-size: 13px; margin-bottom: 8px; display: none; }

        /* Layout */
        .main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; min-height: calc(100vh - 56px); }

        /* Sidebar — white */
        .sidebar { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-y: auto; box-shadow: var(--shadow); }
        .sidebar-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; }

        .tree-item { padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; transition: all var(--transition); }
        .tree-item:hover { background: var(--bg-input); }
        .tree-item.active { background: var(--accent-light); border: 1px solid var(--accent); }
        .tree-machine { font-weight: 600; font-size: 14px; }
        .tree-funnel { padding-left: 24px; font-size: 12px; color: var(--text-secondary); }
        .tree-add { color: var(--accent); font-size: 12px; cursor: pointer; padding: 6px 12px; border-radius: var(--radius-sm); transition: background var(--transition); }
        .tree-add:hover { background: var(--accent-light); }

        .dot { margin-right: 6px; }

        .content { display: flex; flex-direction: column; gap: 16px; }
        .btn-row { margin-top: 14px; }

        /* Threshold sliders */
        .threshold-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .threshold-label { width: 200px; font-size: 13px; }
        .threshold-row input[type=range] { flex: 1; accent-color: var(--accent); }
        .threshold-value { width: 60px; text-align: right; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; color: var(--accent); font-weight: 600; }

        @media (max-width: 768px) { .main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>管理员登录</h2>
            <div class="login-error" id="login-error">密码错误</div>
            <input type="password" id="login-password" placeholder="请输入管理密码" autofocus>
            <div><button class="btn btn-primary" style="width:100%;padding:10px;" onclick="doLogin()">登录</button></div>
        </div>
    </div>

    <div class="header">
        <div>
            <div class="breadcrumb"><a href="/">总览</a> &gt; 系统设置</div>
            <div class="header-title">系统设置</div>
        </div>
    </div>

    <div class="main">
        <!-- Sidebar: tree -->
        <div class="sidebar">
            <div class="sidebar-title">设备管理</div>
            <div id="device-tree"></div>
            <div class="tree-add" onclick="showAddMachine()">+ 添加翻车机</div>
        </div>

        <!-- Content -->
        <div class="content" id="content-panel">
            <div class="card">
                <div class="card-title">检测参数</div>
                <div class="threshold-row">
                    <span class="threshold-label">格栅可见率阈值</span>
                    <input type="range" min="0.5" max="1.0" step="0.01" id="th-grid" oninput="document.getElementById('th-grid-val').textContent=this.value">
                    <span class="threshold-value" id="th-grid-val">0.85</span>
                </div>
                <div class="threshold-row">
                    <span class="threshold-label">积煤覆盖率阈值</span>
                    <input type="range" min="0.01" max="0.30" step="0.01" id="th-coal" oninput="document.getElementById('th-coal-val').textContent=this.value">
                    <span class="threshold-value" id="th-coal-val">0.05</span>
                </div>
                <div class="threshold-row">
                    <span class="threshold-label">投票窗口大小</span>
                    <input type="range" min="3" max="15" step="1" id="th-vote-win" oninput="document.getElementById('th-vote-win-val').textContent=this.value">
                    <span class="threshold-value" id="th-vote-win-val">5</span>
                </div>
                <div class="threshold-row">
                    <span class="threshold-label">投票确认阈值</span>
                    <input type="range" min="2" max="10" step="1" id="th-vote-th" oninput="document.getElementById('th-vote-th-val').textContent=this.value">
                    <span class="threshold-value" id="th-vote-th-val">3</span>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="saveThresholds()">保存参数</button>
                </div>
            </div>

            <!-- Dynamic form area -->
            <div id="edit-form"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let adminToken = sessionStorage.getItem('adminToken') || '';
        const API = '/api/admin';

        // ─── Auth ───
        if (adminToken) {
            document.getElementById('login-overlay').style.display = 'none';
            init();
        }

        document.getElementById('login-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        function doLogin() {
            const pw = document.getElementById('login-password').value;
            apiFetch('/auth', 'POST', { password: pw }, true)
                .then(function(d) {
                    adminToken = d.token;
                    sessionStorage.setItem('adminToken', adminToken);
                    document.getElementById('login-overlay').style.display = 'none';
                    init();
                })
                .catch(function() {
                    document.getElementById('login-error').style.display = 'block';
                });
        }

        // ─── API helper ───
        function apiFetch(path, method, body, noAuth) {
            const headers = { 'Content-Type': 'application/json' };
            if (!noAuth) headers['X-Admin-Token'] = adminToken;
            const opts = { method: method || 'GET', headers: headers };
            if (body) opts.body = JSON.stringify(body);
            return fetch(API + path, opts).then(function(r) {
                if (!r.ok) return r.json().then(function(d) { throw d; });
                return r.json();
            });
        }

        function toast(msg, ok) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
            t.style.display = 'block';
            setTimeout(function() { t.style.display = 'none'; }, 3000);
        }

        // ─── Init ───
        function init() {
            loadTree();
            loadThresholds();
        }

        // ─── Tree ───
        function loadTree() {
            apiFetch('/machines').then(function(d) {
                renderTree(d.machines);
            });
        }

        function renderTree(machines) {
            const tree = document.getElementById('device-tree');
            tree.innerHTML = machines.map(function(m) {
                const plcDot = m.plc_connected ? 'dot-ok' : 'dot-err';
                const funnelsHtml = m.funnels.map(function(f) {
                    const fDot = f.is_running ? 'dot-ok' : 'dot-off';
                    return '<div class="tree-item tree-funnel" onclick="showEditFunnel(\'' + m.id + '\',\'' + f.id + '\'); event.stopPropagation();">'
                        + '<span><span class="dot ' + fDot + '"></span>' + esc(f.name) + '</span>'
                        + '<span style="color:#999;font-size:11px;">' + f.camera_ip + '</span></div>';
                }).join('');
                return '<div class="tree-item tree-machine" onclick="showEditMachine(\'' + m.id + '\')">'
                    + '<span><span class="dot ' + plcDot + '"></span>' + esc(m.name) + '</span>'
                    + '<span style="color:#999;font-size:11px;">' + m.funnel_count + ' 漏斗</span></div>'
                    + funnelsHtml
                    + '<div class="tree-add" onclick="showAddFunnel(\'' + m.id + '\'); event.stopPropagation();">+ 添加漏斗</div>';
            }).join('');
        }

        // ─── Thresholds ───
        function loadThresholds() {
            apiFetch('/thresholds').then(function(d) {
                setSlider('th-grid', d.GRID_VISIBLE_THRESHOLD);
                setSlider('th-coal', d.COAL_COVERAGE_THRESHOLD);
                setSlider('th-vote-win', d.VOTE_WINDOW_SIZE);
                setSlider('th-vote-th', d.VOTE_THRESHOLD);
            });
        }
        function setSlider(id, val) {
            document.getElementById(id).value = val;
            document.getElementById(id + '-val').textContent = val;
        }
        function saveThresholds() {
            apiFetch('/thresholds', 'PUT', {
                GRID_VISIBLE_THRESHOLD: parseFloat(document.getElementById('th-grid').value),
                COAL_COVERAGE_THRESHOLD: parseFloat(document.getElementById('th-coal').value),
                VOTE_WINDOW_SIZE: parseInt(document.getElementById('th-vote-win').value),
                VOTE_THRESHOLD: parseInt(document.getElementById('th-vote-th').value),
            }).then(function() { toast('参数已保存并生效', true); })
              .catch(function(e) { toast('保存失败: ' + (e.detail || e), false); });
        }

        // ─── Forms ───
        function showAddMachine() {
            document.getElementById('edit-form').innerHTML =
                '<div class="card"><div class="card-title">添加翻车机</div>'
                + '<div class="form-grid">'
                + formField('m-id', 'ID (英文)', 'text', 'machine-2')
                + formField('m-name', '名称', 'text', '2#翻车机')
                + formField('m-plc', 'PLC IP', 'text', '192.168.1.19')
                + formField('m-timeout', 'PLC 超时(ms)', 'number', '3000')
                + '</div>'
                + '<div class="btn-row"><button class="btn btn-primary" onclick="doAddMachine()">添加</button></div></div>';
        }

        function doAddMachine() {
            apiFetch('/machines', 'POST', {
                id: gv('m-id'), name: gv('m-name'), plc_ip: gv('m-plc'),
                plc_timeout_ms: parseInt(gv('m-timeout')) || 3000,
            }).then(function() { toast('翻车机已添加', true); loadTree(); document.getElementById('edit-form').innerHTML = ''; })
              .catch(function(e) { toast(e.detail || '添加失败', false); });
        }

        function showEditMachine(mid) {
            apiFetch('/machines').then(function(d) {
                const m = d.machines.find(function(x) { return x.id === mid; });
                if (!m) return;
                document.getElementById('edit-form').innerHTML =
                    '<div class="card"><div class="card-title">编辑翻车机: ' + esc(m.name) + '</div>'
                    + '<div class="form-grid">'
                    + formField('em-name', '名称', 'text', m.name)
                    + formField('em-plc', 'PLC IP', 'text', m.plc_ip)
                    + formField('em-timeout', 'PLC 超时(ms)', 'number', m.plc_timeout_ms)
                    + formField('em-hb', '心跳间隔(ms)', 'number', m.plc_heartbeat_interval_ms)
                    + '</div>'
                    + '<div class="btn-row">'
                    + '<button class="btn btn-primary" onclick="doUpdateMachine(\'' + mid + '\')">保存</button>'
                    + '<button class="btn btn-danger" onclick="doDeleteMachine(\'' + mid + '\', \'' + esc(m.name) + '\')">删除翻车机</button>'
                    + '</div></div>';
            });
        }

        function doUpdateMachine(mid) {
            apiFetch('/machines/' + mid, 'PUT', {
                name: gv('em-name'), plc_ip: gv('em-plc'),
                plc_timeout_ms: parseInt(gv('em-timeout')) || 3000,
                plc_heartbeat_interval_ms: parseInt(gv('em-hb')) || 500,
            }).then(function() { toast('已保存', true); loadTree(); })
              .catch(function(e) { toast(e.detail || '保存失败', false); });
        }

        function doDeleteMachine(mid, name) {
            if (!confirm('确定删除翻车机 "' + name + '"？\n将断开所有相机和PLC连接。')) return;
            apiFetch('/machines/' + mid, 'DELETE')
                .then(function() { toast('已删除', true); loadTree(); document.getElementById('edit-form').innerHTML = ''; })
                .catch(function(e) { toast(e.detail || '删除失败', false); });
        }

        function showAddFunnel(mid) {
            document.getElementById('edit-form').innerHTML =
                '<div class="card"><div class="card-title">添加漏斗 (' + mid + ')</div>'
                + '<div class="form-grid">'
                + formField('f-id', 'ID (英文)', 'text', 'funnel-2')
                + formField('f-name', '名称', 'text', '2#漏斗')
                + formField('f-cam', '相机 IP', 'text', '192.168.1.13')
                + formField('f-fmt', '像素格式', 'text', 'mono')
                + formField('f-grid', '格栅数量', 'number', '125')
                + formField('f-timeout', '相机超时(ms)', 'number', '5000')
                + '</div>'
                + '<div class="btn-row"><button class="btn btn-primary" onclick="doAddFunnel(\'' + mid + '\')">添加</button></div></div>';
        }

        function doAddFunnel(mid) {
            apiFetch('/machines/' + mid + '/funnels', 'POST', {
                id: gv('f-id'), name: gv('f-name'), camera_ip: gv('f-cam'),
                pixel_format: gv('f-fmt'), grid_count: parseInt(gv('f-grid')) || 125,
                camera_timeout_ms: parseInt(gv('f-timeout')) || 5000,
            }).then(function() { toast('漏斗已添加', true); loadTree(); document.getElementById('edit-form').innerHTML = ''; })
              .catch(function(e) { toast(e.detail || '添加失败', false); });
        }

        function showEditFunnel(mid, fid) {
            apiFetch('/machines').then(function(d) {
                const m = d.machines.find(function(x) { return x.id === mid; });
                if (!m) return;
                const f = m.funnels.find(function(x) { return x.id === fid; });
                if (!f) return;
                document.getElementById('edit-form').innerHTML =
                    '<div class="card"><div class="card-title">编辑漏斗: ' + esc(f.name) + '</div>'
                    + '<div class="form-grid">'
                    + formField('ef-name', '名称', 'text', f.name)
                    + formField('ef-cam', '相机 IP', 'text', f.camera_ip)
                    + formField('ef-fmt', '像素格式', 'text', f.pixel_format)
                    + formField('ef-grid', '格栅数量', 'number', f.grid_count)
                    + formField('ef-timeout', '相机超时(ms)', 'number', f.camera_timeout_ms)
                    + '</div>'
                    + '<div class="btn-row">'
                    + '<button class="btn btn-primary" onclick="doUpdateFunnel(\'' + mid + '\',\'' + fid + '\')">保存</button>'
                    + '<button class="btn btn-danger" onclick="doDeleteFunnel(\'' + mid + '\',\'' + fid + '\',\'' + esc(f.name) + '\')">删除漏斗</button>'
                    + '</div></div>';
            });
        }

        function doUpdateFunnel(mid, fid) {
            apiFetch('/machines/' + mid + '/funnels/' + fid, 'PUT', {
                name: gv('ef-name'), camera_ip: gv('ef-cam'), pixel_format: gv('ef-fmt'),
                grid_count: parseInt(gv('ef-grid')) || 125, camera_timeout_ms: parseInt(gv('ef-timeout')) || 5000,
            }).then(function() { toast('已保存', true); loadTree(); })
              .catch(function(e) { toast(e.detail || '保存失败', false); });
        }

        function doDeleteFunnel(mid, fid, name) {
            if (!confirm('确定删除漏斗 "' + name + '"？\n将断开相机连接。')) return;
            apiFetch('/machines/' + mid + '/funnels/' + fid, 'DELETE')
                .then(function() { toast('已删除', true); loadTree(); document.getElementById('edit-form').innerHTML = ''; })
                .catch(function(e) { toast(e.detail || '删除失败', false); });
        }

        // ─── Helpers ───
        function gv(id) { return document.getElementById(id).value; }
        function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function formField(id, label, type, val) {
            return '<div class="form-group"><label>' + label + '</label>'
                + '<input type="' + type + '" id="' + id + '" value="' + esc(String(val || '')) + '"></div>';
        }
    </script>
</body>
</html>
