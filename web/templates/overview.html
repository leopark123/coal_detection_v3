<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻车机积煤检测系统</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .machine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 20px;
            padding: 24px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .machine-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .machine-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .machine-card.alert-CRITICAL { border-left: 3px solid var(--danger); }
        .machine-card.alert-WARNING { border-left: 3px solid var(--orange); }
        .machine-card.alert-ATTENTION { border-left: 3px solid var(--warning); }
        .machine-card.alert-NORMAL { border-left: 3px solid var(--success); }

        .machine-header {
            padding: 16px 18px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .machine-name { font-size: 16px; font-weight: 600; }

        .funnel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px; padding: 14px 18px;
        }
        .funnel-cell {
            background: rgba(8, 8, 20, 0.5);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 8px;
            text-align: center;
            transition: all var(--transition);
        }
        .funnel-cell.alert-NORMAL { border-color: rgba(46, 204, 113, 0.3); }
        .funnel-cell.alert-CRITICAL { border-color: rgba(231, 76, 60, 0.4); background: var(--danger-bg); }
        .funnel-cell.alert-WARNING { border-color: rgba(230, 126, 34, 0.4); }
        .funnel-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        .funnel-stat { font-size: 10px; color: var(--text-muted); }
        .funnel-stat .value { color: var(--text-secondary); font-weight: 600; }

        .machine-footer {
            padding: 10px 18px;
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--text-muted);
        }
        .btn-vision {
            padding: 4px 12px; border-radius: 14px; font-size: 11px; font-weight: 600;
            border: 1px solid; cursor: pointer; transition: all var(--transition);
            letter-spacing: 0.3px;
        }
        .btn-vision-on {
            background: var(--success-bg); color: var(--success); border-color: rgba(46,204,113,0.3);
        }
        .btn-vision-on:hover { background: rgba(46,204,113,0.2); }
        .btn-vision-off {
            background: rgba(85,90,110,0.15); color: var(--text-muted); border-color: rgba(85,90,110,0.3);
        }
        .btn-vision-off:hover { background: rgba(85,90,110,0.25); }

        /* Summary bar */
        .summary-bar {
            display: flex; gap: 24px; padding: 16px 24px;
            max-width: 1500px; margin: 0 auto;
        }
        .summary-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-muted);
        }
        .summary-num { font-size: 20px; font-weight: 700; color: var(--text-primary); }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .empty-state h2 { font-size: 16px; margin-bottom: 6px; color: var(--text-secondary); }

        @media (max-width: 500px) {
            .machine-grid { grid-template-columns: 1fr; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>翻车机积煤检测系统</h1>
        </div>
        <div class="header-right">
            <span id="clock" style="font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;"></span>
            <div class="conn-status">
                <div class="conn-dot" id="ws-dot"></div>
                <span id="ws-text">连接中...</span>
            </div>
            <a href="/settings" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                设置
            </a>
        </div>
    </div>

    <div class="summary-bar" id="summary-bar"></div>

    <div class="machine-grid" id="machine-grid">
        <div class="empty-state">
            <h2>等待连接...</h2>
            <p>正在连接服务器</p>
        </div>
    </div>

    <script src="/static/js/ws-reconnect.js"></script>
    <script>
        const machineGrid = document.getElementById('machine-grid');
        const summaryBar = document.getElementById('summary-bar');
        const wsDot = document.getElementById('ws-dot');
        const wsText = document.getElementById('ws-text');

        const alertMap = { 'NORMAL': '正常', 'ATTENTION': '关注', 'WARNING': '警告', 'CRITICAL': '紧急', 'UNKNOWN': '未知' };

        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        function renderMachines(machines) {
            if (!machines || machines.length === 0) {
                machineGrid.innerHTML = '<div class="empty-state"><h2>无翻车机配置</h2><p>前往 <a href="/settings" style="color:var(--accent)">系统设置</a> 添加翻车机</p></div>';
                summaryBar.innerHTML = '';
                return;
            }

            // Summary
            const totalMachines = machines.length;
            const totalFunnels = machines.reduce(function(s, m) { return s + m.funnel_count; }, 0);
            const totalDetections = machines.reduce(function(s, m) { return s + m.funnels.reduce(function(s2, f) { return s2 + f.detection_count; }, 0); }, 0);
            const alarms = machines.filter(function(m) { return m.alert_level === 'CRITICAL' || m.alert_level === 'WARNING'; }).length;

            summaryBar.innerHTML =
                '<div class="summary-item"><span class="summary-num">' + totalMachines + '</span>翻车机</div>'
                + '<div class="summary-item"><span class="summary-num">' + totalFunnels + '</span>漏斗</div>'
                + '<div class="summary-item"><span class="summary-num">' + totalDetections.toLocaleString() + '</span>检测帧</div>'
                + (alarms > 0 ? '<div class="summary-item"><span class="summary-num" style="color:var(--danger)">' + alarms + '</span>报警</div>' : '');

            // Cards (with staggered animation)
            machineGrid.innerHTML = machines.map(function(m, idx) {
                const ac = 'alert-' + (m.alert_level || 'UNKNOWN');
                const pc = m.plc_connected ? 'online' : 'offline';
                const pulseClass = (m.alert_level === 'CRITICAL') ? ' alert-pulse' : '';

                var phaseMap = {'idle':'空闲','delay':'延时','capturing':'采集中','judging':'判定'};
                const fhtml = m.funnels.map(function(f) {
                    const fac = 'alert-' + (f.alert_level || 'UNKNOWN');
                    const ci = f.total_grids > 0 ? f.coal_grids + '/' + f.total_grids : '--';
                    const cp = f.capture_phase || 'idle';
                    const cpText = phaseMap[cp] || cp;
                    const cpStyle = cp === 'capturing' ? 'color:var(--accent);font-weight:600' : '';
                    return '<div class="funnel-cell ' + fac + '">'
                        + '<div class="funnel-name">' + esc(f.name) + '</div>'
                        + '<div class="funnel-stat">积煤 <span class="value">' + ci + '</span></div>'
                        + '<div class="funnel-stat">帧数 <span class="value">' + f.detection_count + '</span></div>'
                        + '<div class="funnel-stat" style="' + cpStyle + '">' + cpText + '</div>'
                        + '</div>';
                }).join('');

                const td = m.funnels.reduce(function(s, f) { return s + f.detection_count; }, 0);
                const tc = m.funnels.reduce(function(s, f) { return s + f.coal_detections; }, 0);

                const ve = m.vision_enabled !== false;
                const vBtnClass = ve ? 'btn-vision-on' : 'btn-vision-off';
                const vBtnText = ve ? '采集中' : '已停用';
                const vBtnIcon = ve ? '●' : '○';

                return '<div class="machine-card ' + ac + pulseClass + ' animate-in" style="animation-delay:' + (idx * 0.08) + 's">'
                    + '<div class="machine-header" onclick="location.href=\'/machine/' + m.id + '\'">'
                    + '<span class="machine-name">' + esc(m.name) + '</span>'
                    + '<div style="display:flex;align-items:center;gap:10px;">'
                    + '<span class="alert-badge ' + ac + '">' + (alertMap[m.alert_level] || m.alert_level) + '</span>'
                    + '<div class="plc-status"><div class="plc-dot ' + pc + '"></div>' + (m.plc_connected ? 'PLC' : 'PLC 离线') + '</div>'
                    + '</div></div>'
                    + '<div class="funnel-grid" onclick="location.href=\'/machine/' + m.id + '\'">' + fhtml + '</div>'
                    + '<div class="machine-footer">'
                    + '<span>' + m.funnel_count + ' 漏斗 · ' + td.toLocaleString() + ' 帧 / ' + tc + ' 报警</span>'
                    + '<button class="btn-vision ' + vBtnClass + '" onclick="event.stopPropagation();toggleVision(\'' + m.id + '\',' + ve + ')">'
                    + vBtnIcon + ' ' + vBtnText + '</button>'
                    + '</div></div>';
            }).join('');
        }

        // Vision enable/disable toggle
        function toggleVision(machineId, currentState) {
            const action = currentState ? 'disable' : 'enable';
            const label = currentState ? '停用' : '启用';
            if (!confirm('确认' + label + '该翻车机的视觉采集？\n\n停用后 PLC 侧 Allow_Tip 将强制为 1（允许翻车）')) return;
            fetch('/api/machine/' + machineId + '/vision/' + action, { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.error) { alert('操作失败: ' + d.error); }
                })
                .catch(function(e) { alert('请求失败: ' + e); });
        }

        // Real-time clock
        setInterval(function() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleDateString('zh-CN') + ' ' +
                now.toLocaleTimeString('zh-CN', {hour12: false});
        }, 1000);

        createReconnectingWS(
            'ws://' + location.host + '/ws/overview',
            function(data) { renderMachines(data.machines); },
            {
                onOpen: function() { wsDot.className = 'conn-dot connected'; wsText.textContent = '已连接'; },
                onClose: function() { wsDot.className = 'conn-dot disconnected'; wsText.textContent = '重连中...'; }
            }
        );
    </script>
</body>
</html>
