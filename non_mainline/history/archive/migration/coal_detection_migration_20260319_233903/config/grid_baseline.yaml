# 翻车机积煤检测系统 V3.0 - 格栅基线配置
# 存储格栅ROI标定数据

# ═══════════════════════════════════════════════════════════════
# 格栅布局参数
# ═══════════════════════════════════════════════════════════════
grid_layout:
  rows: 4        # 格栅行数
  cols: 6        # 格栅列数

# ═══════════════════════════════════════════════════════════════
# ROI 边界（百分比坐标，相对于图像尺寸）
# ═══════════════════════════════════════════════════════════════
roi_bounds:
  left: 0.1      # 左边界（图像宽度的10%）
  right: 0.9     # 右边界（图像宽度的90%）
  top: 0.15      # 上边界（图像高度的15%）
  bottom: 0.85   # 下边界（图像高度的85%）

# ═══════════════════════════════════════════════════════════════
# 格栅孔参数
# ═══════════════════════════════════════════════════════════════
hole_params:
  width_ratio: 0.08   # 孔宽度占图像宽度的比例
  height_ratio: 0.10  # 孔高度占图像高度的比例

# ═══════════════════════════════════════════════════════════════
# 检测阈值
# ═══════════════════════════════════════════════════════════════
detection_thresholds:
  binary_threshold: 120     # 二值化阈值
  min_contour_area: 100     # 最小轮廓面积
  max_contour_area: 10000   # 最大轮廓面积
  aspect_ratio_min: 0.5     # 最小长宽比
  aspect_ratio_max: 2.0     # 最大长宽比

# ═══════════════════════════════════════════════════════════════
# 标定信息
# ═══════════════════════════════════════════════════════════════
calibration:
  calibrated: false  # 是否已完成标定
  calibration_date: null
  calibrator: null
  notes: "使用默认百分比坐标，需要现场标定"

# ═══════════════════════════════════════════════════════════════
# 格栅孔位置（可选，通过标定工具生成）
# ═══════════════════════════════════════════════════════════════
# hole_positions:
#   - {row: 0, col: 0, center_x: 0.15, center_y: 0.25}
#   - {row: 0, col: 1, center_x: 0.30, center_y: 0.25}
#   # ... 更多位置数据