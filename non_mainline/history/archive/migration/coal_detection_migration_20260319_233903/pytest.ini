[pytest]
addopts = -p no:cacheprovider
testpaths =
    tests
    test_cv_window.py
    test_device1_detection.py
    test_grid_detection.py
    test_grid_final.py
    test_grid_simple.py
    test_precise_detection.py
    test_single_grid_detection.py
norecursedirs =
    pytest-cache-files-*
    .pytest_cache
    .tmp_pytest_cache
markers =
    integration: integration tests
    slow: slow-running tests
    benchmark: benchmark tests
